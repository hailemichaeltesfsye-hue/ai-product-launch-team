<g><rect x="490" y="326" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="545" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Pricing</text></g>

<line x1="415" y1="370" x2="450" y2="410" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="370" x2="510" y2="410" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="360" y="410" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="480" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Finance manager agent</text>
<text x="480" y="446" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Aggregator</text>
</g>

<line x1="180" y1="466" x2="300" y2="530" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="466" x2="380" y2="530" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="530" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="554" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">CEO synthesizer agent</text>

<line x1="340" y1="578" x2="340" y2="610" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="610" width="180" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="628" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">Final launch plan</text>
</svg>
