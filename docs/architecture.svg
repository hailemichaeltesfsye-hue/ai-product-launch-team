<text x="180" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Marketing manager agent</text>
<text x="180" y="446" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Aggregator</text>
</g>

<rect x="340" y="190" width="280" height="296" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="480" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Finance manager</text>

