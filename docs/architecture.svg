<line x1="220" y1="286" x2="245" y2="326" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="60" y="326" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="115" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Research</text></g>
<g><rect x="190" y="326" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="245" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Content</text></g>

<line x1="115" y1="370" x2="150" y2="410" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
