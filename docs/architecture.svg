<svg width="680" height="670" viewBox="0 0 680 670" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hierarchical multi-agent architecture</title>
<desc>User request flows to a CEO agent, which delegates to a Marketing Manager subgraph and a Finance Manager subgraph running in parallel. Each manager decomposes work to two specialist agents, then aggregates their results. Both manager reports converge on a CEO synthesizer, producing the final launch plan.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="670" fill="#ffffff"/>

<rect x="260" y="20" width="160" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">User request</text>

<line x1="340" y1="56" x2="340" y2="90" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="90" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">CEO agent / supervisor</text>

<line x1="280" y1="138" x2="180" y2="190" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="138" x2="480" y2="190" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="190" width="280" height="296" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="212" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Marketing manager</text>

<g>
<rect x="60" y="230" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Marketing manager agent</text>
<text x="180" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Decomposer</text>
</g>

